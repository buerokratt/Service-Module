    build:
      context: ./GUI
      dockerfile: Dockerfile.dev
    ports:
      - 3006:3006
    volumes: # Comment the volumes if you want to use this in production
      - /app/node_modules
      - ./GUI:/app
    networks:
      - bykstack

  tim:
    container_name: tim
    image: tim
    depends_on:
      - tim-postgresql
    environment:
      - SECURITY_ALLOWLIST_JWT=ruuter,resql,resql_users,resql_training,tim,tim-postgresql,node_server,data_mapper,gui_dev,127.0.0.1,::1
      - JWT_INTEGRATION_SIGNATURE_KEY_STORE_PASSWORD=defaultpassword
    ports:
      - 8085:8085
    networks:
      - bykstack
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: "0.5" # Example CPU limit
    mem_limit: "512M" # Example memory limit

  tim-postgresql:
    container_name: tim-postgresql
    image: postgres:14.1
    environment:
      - POSTGRES_USER=tim
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=tim
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./tim-db:/var/lib/postgresql/data
    ports:
      - 9876:5432
    networks:
      - bykstack

  pipelines:
    container_name: pipelines
    build:
      context: ./DSL/Pipelines
    environment:
      - OPENSEARCH_PROTOCOL=http
      - PORT=3010
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_AUTH=admin:admin
    ports:
      - 3010:3010
    networks:
      - bykstack

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: opensearch
    environment:
      - node.name=opensearch
      - discovery.seed_hosts=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.security.disabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600
    networks:
      - bykstack

  storage-ferry:
    container_name: s3-ferry
    image: s3-ferry
    platform: linux/amd64
    depends_on:
      - azurite
      - azurite-init
    environment:
      - API_CORS_ORIGIN=*
      - API_DOCUMENTATION_ENABLED=true
      - S3_DEFAULT_REGION=us-east-1
      - S3_DEFAULT_ENDPOINT_URL=http://s3.localhost:4566
      - S3_DEFAULT_ACCESS_KEY_ID=accesskey
      - S3_DEFAULT_SECRET_ACCESS_KEY=secretkey
      - S3_DEFAULT_DATA_BUCKET_NAME=buerokratt
      - S3_DEFAULT_DATA_BUCKET_PATH=
      - S3_DEFAULT_FS_DATA_DIRECTORY_PATH=/data
      - S3_CHATS_REGION=us-east-1
      - S3_CHATS_ENDPOINT_URL=http://s3.localhost:4566
      - S3_CHATS_ACCESS_KEY_ID=accesskey
      - S3_CHATS_SECRET_ACCESS_KEY=secretkey
      - S3_CHATS_DATA_BUCKET_NAME=chats
      - S3_CHATS_DATA_BUCKET_PATH=
      - S3_CHATS_FS_DATA_DIRECTORY_PATH=/chats
      - AZURE_ACCOUNT_1_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=testaccount1;AccountKey=dGVzdGtleTE9PQ==;BlobEndpoint=http://azurite:10000/testaccount1;QueueEndpoint=http://azurite:10001/testaccount1;TableEndpoint=http://azurite:10002/testaccount1;
      - AZURE_ACCOUNT_2_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=testaccount2;AccountKey=dGVzdGtleTI9PQ==;BlobEndpoint=http://azurite:10000/testaccount2;QueueEndpoint=http://azurite:10001/testaccount2;TableEndpoint=http://azurite:10002/testaccount2;
      - AZURE_ACCOUNT_3_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=testaccount3;AccountKey=dGVzdGtleTM9PQ==;BlobEndpoint=http://azurite:10000/testaccount3;QueueEndpoint=http://azurite:10001/testaccount3;TableEndpoint=http://azurite:10002/testaccount3;
    ports:
      - 3007:3000
    networks:
      - bykstack

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - 10000:10000
      - 10001:10001
      - 10002:10002
    environment:
      - AZURITE_ACCOUNTS=testaccount1:dGVzdGtleTE9PQ==;
    volumes:
      - azurite-data:/data
    command: ["azurite", "-l", "/data", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--skipApiVersionCheck"]  
    networks:
      - bykstack

  azurite-init:
    image: node:24-alpine
    depends_on:
      - azurite
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: /bin/sh
    command: -c "/scripts/azurite-init.sh"
    networks:
      - bykstack

volumes:
  opensearch-data1:
  azurite-data:

networks:
  bykstack:
    name: bykstack
    driver: bridge
