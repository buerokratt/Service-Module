<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vertical flow layout icon (centered)">
  <!-- Background rounded square -->
  <rect x="16" y="16" width="224" height="224" rx="28" ry="28" fill="#005AA3"/>
  
  <!-- Top node -->
  <rect x="98" y="56" width="60" height="32" rx="6" ry="6" fill="#FFFFFF"/>
  
  <!-- Vertical stem -->
  <rect x="124" y="88" width="8" height="40" fill="#FFFFFF"/>
  
  <!-- Horizontal connector (aligned with down connectors) -->
  <rect x="84" y="128" width="88" height="8" fill="#FFFFFF"/>
  
  <!-- Down connectors -->
  <rect x="84" y="136" width="8" height="24" fill="#FFFFFF"/>
  <rect x="164" y="136" width="8" height="24" fill="#FFFFFF"/>
  
  <!-- Bottom left node -->
  <rect x="56" y="160" width="60" height="32" rx="6" ry="6" fill="#FFFFFF"/>
  
  <!-- Bottom right node -->
  <rect x="140" y="160" width="60" height="32" rx="6" ry="6" fill="#FFFFFF"/>
</svg>
