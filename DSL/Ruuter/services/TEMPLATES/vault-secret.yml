declaration:
  call: declare
  version: 0.1
  description: "Reads a Service-Module secret from Vault via the Service-Module Vault Agent (no raw Vault token is handled here). Returns { status, data } where status is ok, missing, denied or unavailable - never the raw Vault response."
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: name
        type: string
        description: "Secret name under [#SERVICE_VAULT_SECRETS_PATH], e.g. 'azure-search'"

extract_request_data:
  assign:
    name: ${incoming.body.name ?? ''}
  next: check_secret_name

check_secret_name:
  switch:
    - condition: ${/^[A-Za-z0-9_-]+$/.test(name)}
      next: read_secret
  next: log_invalid_name

read_secret:
  call: http.get
  args:
    url: "[#SERVICE_VAULT_AGENT]/v1/secret/data/[#SERVICE_VAULT_SECRETS_PATH]/${name}"
  logging:
    request: false
    response: false
  result: secret_res
  error: check_secret_response
  next: check_secret_response

check_secret_response:
  switch:
    - condition: ${secret_res.response.statusCodeValue === 200 && secret_res.response.body.data != null && secret_res.response.body.data.data != null}
      next: assign_secret
    - condition: ${secret_res.response.statusCodeValue === 200 || secret_res.response.statusCodeValue === 404}
      next: log_missing
    - condition: ${secret_res.response.statusCodeValue === 403}
      next: log_denied
  next: log_unavailable

assign_secret:
  assign:
    result:
      status: "ok"
      data: ${secret_res.response.body.data.data}
  next: return_result

log_missing:
  log: "Vault secret '[#SERVICE_VAULT_SECRETS_PATH]/${name}' is missing"
  next: assign_missing

assign_missing:
  assign:
    result:
      status: "missing"
  next: return_result

log_denied:
  log: "Vault access denied for secret '[#SERVICE_VAULT_SECRETS_PATH]/${name}' - check the Service-Module Vault policy"
  next: assign_denied

assign_denied:
  assign:
    result:
      status: "denied"
  next: return_result

log_unavailable:
  log: "Vault is unavailable while reading secret '[#SERVICE_VAULT_SECRETS_PATH]/${name}' (Vault Agent responded with status ${secret_res.response.statusCodeValue})"
  next: assign_unavailable

assign_unavailable:
  assign:
    result:
      status: "unavailable"
  next: return_result

log_invalid_name:
  log: "Invalid Vault secret name requested"
  next: assign_invalid_name

assign_invalid_name:
  assign:
    result:
      status: "invalid"
  next: return_result

return_result:
  return: ${result}
  next: end
