declaration:
  call: declare
  version: 0.1
  description: "Delete a endpoint by its ID"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: id
        type: string
        description: "Endpoint ID"

check_for_required_parameters:
  switch:
    - condition: ${incoming.body.id === null}
      next: return_incorrect_request
  next: get_services_by_endpoint_id

get_services_by_endpoint_id:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/get-services-by-endpoint-id"
    body:
      endpoint_id: ${incoming.body.id}
      excluded_service_id: ""
  result: results

# todo remove
logstep1:
  log: ${results.response.body}

logstep2:
  log: ${results.response.body.map((service) => service.serviceId)}
  next: end

return_incorrect_request:
  status: 400
  return: "Required parameter(s) missing"
  next: end
