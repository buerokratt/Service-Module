declaration:
  call: declare
  version: 0.1
  description: "Deletes an endpoint"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
        description: "Cookie field"
    body:
      - field: id
        type: string
        description: "Endpoint UUID"
      - field: service_name
        type: string
        description: "Service Name"  
      - field: endpoint_name
        type: string
        description: "Endpoint Name"

delete_endpoint_files:
  call: http.post
  args:
    url: "[#SERVICE_RUUTER]/services/delete-endpoint-files"
    headers:
      cookie: ${incoming.headers.cookie}
    body:
      name: ${incoming.body.service_name}
      endpoint_name: ${incoming.body.endpoint_name}
  result: delete_files_res        

delete_endpoint:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/endpoints/delete_endpoint"
    body:
      id: ${incoming.body.id}
  result: res

return_ok:
  status: 200
  return: "Endpoint deleted"
  next: end
