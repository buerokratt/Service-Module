declaration:
  call: declare
  version: 0.1
  description: "Unpins a service for the current user"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    header:
      - field: cookie
        type: string
        description: "Cookie field"
    body:
      - field: service_id
        type: string
        description: "Body field 'service_id'"

check_for_required_parameters:
  switch:
    - condition: ${!incoming.body || !incoming.body.service_id}
      next: return_incorrect_request
  next: get_user_info

get_user_info:
  call: http.post
  args:
    url: "[#SERVICE_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${incoming.headers.cookie}
    plaintext: "customJwtCookie"
  result: res

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: assign_id_code
  next: return_unauthorized

assign_id_code:
  assign:
    idCode: ${res.response.body.idCode}

unpin_service:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/services/unpin_service"
    body:
      user_id_code: ${idCode}
      service_id: ${incoming.body.service_id}
  result: unpin_res

return_ok:
  status: 200
  return: "ok"
  next: end

return_incorrect_request:
  status: 400
  return: "Required parameter(s) missing"
  next: end

return_unauthorized:
  status: 401
  return: "unauthorized"
  next: end
