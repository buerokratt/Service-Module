declaration:
  call: declare
  version: 0.1
  description: "Updates an existing endpoint"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: name
        type: string
        description: "Endpoint name"
      - field: type
        type: string
        description: "Endpoint type"
      - field: serviceId
        type: string
        description: "Service UUID"
      - field: definitions
        type: object
        description: "Endpoint definitions"
      - field: description
        type: string
        description: "Endpoint description"
    params:
      - field: id
        type: string
        description: "Endpoint UUID"
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

extract_request_data:
  assign:
    id: ${incoming.params.id}

check_for_type:
  switch:
    - condition: ${id == null}
      next: return_no_type_error

update_endpoint:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/endpoints/update_endpoint"
    body:
      endpointId: ${id}
      name: ${incoming.body.name}
      type: ${incoming.body.type}
      serviceId: ${incoming.body.serviceId ?? ''}
      definitions: ${incoming.body.definitions}
      description: ${incoming.body.description ?? ''}
  result: res

call_index_llm:
  call: http.post
  args:
    url: "[#SERVICE_RUUTER]/endpoints/index-llm"
    headers:
      cookie: ${incoming.headers.cookie}
    body:
      endpointId: ${id}
  result: index_llm_result

# When the LLM module is unreachable, Ruuter aborts the indexing flow after the attempt started
# (a connection error cannot be caught inside that flow), so it returns 5xx and the attempt would
# stay IN_PROGRESS until the timeout. Mark it FAILED here; a result already recorded is not touched.
check_index_crashed:
  switch:
    - condition: ${index_llm_result != null && index_llm_result.response != null && index_llm_result.response.statusCodeValue >= 500}
      next: mark_index_unreachable
  next: assign_index_warning

mark_index_unreachable:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/endpoints/mark_endpoint_llm_index_unreachable"
    body:
      endpointId: ${id}
      failureReason: "LLM module is not reachable. Please try again later."
  result: mark_unreachable_res
  next: assign_index_warning

# Indexing never blocks saving. index-llm owns all indexing status changes; here we only
# surface a validation warning (e.g. missing description) so the GUI can show a toast.
assign_index_warning:
  assign:
    index_warning: "${index_llm_result != null && index_llm_result.response != null && index_llm_result.response.body != null && index_llm_result.response.body.response != null && index_llm_result.response.body.response.code != null && String(index_llm_result.response.body.response.code).startsWith('VALIDATION_') ? index_llm_result.response.body.response.code : null}"

assign_response:
  assign:
    update_response:
      message: "Endpoint updated"
      indexWarning: ${index_warning}

return_ok:
  status: 200
  return: ${update_response}
  next: end

return_no_type_error:
  status: 400
  return: "Please provide an endpoint ID"
  next: end
