declaration:
  call: declare
  version: 0.1
  description: "Creates a new endpoint"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: endpointId
        type: string
        description: "Endpoint UUID"
      - field: name
        type: string
        description: "Endpoint name"
      - field: type
        type: string
        description: "Endpoint type"

      - field: serviceId
        type: string
        description: "Service UUID"
      - field: definitions
        type: object
        description: "Endpoint definitions"
      - field: description
        type: string
        description: "Endpoint description"
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

create_endpoint:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/endpoints/create_endpoint"
    body:
      endpointId: ${incoming.body.endpointId}
      name: ${incoming.body.name}
      type: ${incoming.body.type}
      serviceId: ${incoming.body.serviceId ?? ''}
      definitions: ${incoming.body.definitions}
      description: ${incoming.body.description ?? ''}
  result: res

call_index_llm:
  call: http.post
  args:
    url: "[#SERVICE_RUUTER]/endpoints/index-llm"
    headers:
      cookie: ${incoming.headers.cookie}
    body:
      endpointId: ${incoming.body.endpointId}
  result: index_llm_result

check_index_llm_result:
  switch:
    - condition: ${index_llm_result != null && index_llm_result.response != null && 200 <= index_llm_result.response.statusCodeValue && index_llm_result.response.statusCodeValue < 300}
      next: return_ok
  next: mark_llm_sync_failed

mark_llm_sync_failed:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/endpoints/update_endpoint_llm_sync_status"
    body:
      endpointId: ${incoming.body.endpointId}
      status: FAILED
  result: update_sync_res
  next: log_index_llm_failure

log_index_llm_failure:
  log: "Warning: LLM indexing failed for endpoint ${incoming.body.endpointId}"
  next: return_ok

return_ok:
  status: 200
  return: "Endpoint created"
  next: end
