declaration:
  call: declare
  version: 0.1
  description: "Creates a new endpoint"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: endpointId
        type: string
        description: "Endpoint UUID"
      - field: name
        type: string
        description: "Endpoint name"
      - field: type
        type: string
        description: "Endpoint type"

      - field: serviceId
        type: string
        description: "Service UUID"
      - field: definitions
        type: object
        description: "Endpoint definitions"
      - field: description
        type: string
        description: "Endpoint description"
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

create_endpoint:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/endpoints/create_endpoint"
    body:
      endpointId: ${incoming.body.endpointId}
      name: ${incoming.body.name}
      type: ${incoming.body.type}
      serviceId: ${incoming.body.serviceId ?? ''}
      definitions: ${incoming.body.definitions}
      description: ${incoming.body.description ?? ''}
  result: res

call_index_llm:
  call: http.post
  args:
    url: "[#SERVICE_RUUTER]/endpoints/index-llm"
    headers:
      cookie: ${incoming.headers.cookie}
    body:
      endpointId: ${incoming.body.endpointId}
  result: index_llm_result

# Indexing never blocks saving. index-llm owns all indexing status changes; here we only
# surface a validation warning (e.g. missing description) so the GUI can show a toast.
assign_index_warning:
  assign:
    index_warning: "${index_llm_result != null && index_llm_result.response != null && index_llm_result.response.body != null && index_llm_result.response.body.response != null && index_llm_result.response.body.response.code != null && String(index_llm_result.response.body.response.code).startsWith('VALIDATION_') ? index_llm_result.response.body.response.code : null}"

assign_response:
  assign:
    create_response:
      message: "Endpoint created"
      indexWarning: ${index_warning}

return_ok:
  status: 200
  return: ${create_response}
  next: end
