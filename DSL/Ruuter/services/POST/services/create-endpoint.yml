declaration:
  call: declare
  version: 0.1
  description: "Creates a new endpoint"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: id
        type: string
        description: "Endpoint UUID"
      - field: name
        type: string
        description: "Endpoint name"
      - field: fileName
        type: string
        description: "Endpoint file name"
      - field: type
        type: string
        description: "Endpoint type"
      - field: isCommon
        type: boolean
        description: "Endpoint common status"
      - field: serviceId
        type: string
        description: "Service UUID"
      - field: definitions
        type: json
        description: "Endpoint definitions"

log_endpoint_data:
  log: ${incoming.body}

create_endpoint:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/endpoints/create_endpoint"
    body:
      endpointId: ${incoming.body.endpointId}
      name: ${incoming.body.name}
      fileName: ${incoming.body.fileName}
      type: ${incoming.body.type}
      isCommon: ${incoming.body.isCommon}
      serviceId: ${incoming.body.serviceId}
      definitions: ${incoming.body.definitions}

return_ok:
  status: 200
  return: "Endpoint created"
  next: end
