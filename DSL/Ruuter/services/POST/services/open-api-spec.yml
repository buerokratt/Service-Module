declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'OPEN-API-SPEC'"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: url
        type: string
        description: "Body field 'url'"

check_for_required_parameters:
  switch:
    - condition: ${incoming.body == null || incoming.body.url == null}
      next: return_incorrect_request
  next: validate_origin

validate_origin:
  switch:
    - condition: ${typeof(incoming.body.url) === "string" && incoming.body.url.length <= 2048 && "[#SERVICE_OPENAPI_ALLOWED_ORIGINS]".split(",").includes(incoming.body.url.split("/").slice(0, 3).join("/")) && !incoming.body.url.split("/")[2].includes("@")}
      next: get_spec
  next: return_disallowed_origin

return_disallowed_origin:
  status: 403
  return: "OpenAPI origin is not configured for this test deployment"
  next: end

get_spec:
  call: http.get
  args:
    url: ${incoming.body.url}
  result: result

return_value:
  return: ${result.response.body}
  next: end

return_incorrect_request:
  status: 400
  return: "missing parameters"
  next: end
