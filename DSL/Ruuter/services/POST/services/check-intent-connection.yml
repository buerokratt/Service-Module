declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'CHECK-INTENT-CONNECTION'"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: serviceId
        type: string
        description: "Body field 'serviceId'"

extract_request_data:
  assign:
    serviceId: ${incoming.body.serviceId}

check_for_intent_connection:
  call: http.get
  args:
    url: "[#SERVICE_TRAINING_RESQL]/service_management/get_service_trigger_by_id"
    query:
      serviceId: ${serviceId}
  result: res

return_result:
  status: 200
  return: ${res.response.body[0]}
