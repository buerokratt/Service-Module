declaration:
  call: declare
  version: 0.1
  description: "Finds the page on which a service appears in the overview listing"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    header:
      - field: cookie
        type: string
        description: "Cookie field"
    body:
      - field: service_id
        type: string
        description: "Body field 'service_id'"
      - field: page_size
        type: number
        description: "Body field 'page_size'"
      - field: sorting
        type: string
        description: "Body field 'sorting'"
      - field: search
        type: string
        description: "Body field 'search'"
      - field: state
        type: string
        description: "Body field 'state'"
      - field: dependencies
        type: string
        description: "Body field 'dependencies'"

check_for_required_parameters:
  switch:
    - condition: ${!incoming.body || !incoming.body.service_id}
      next: return_incorrect_request
  next: get_user_info

get_user_info:
  call: http.post
  args:
    url: "[#SERVICE_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${incoming.headers.cookie}
    plaintext: "customJwtCookie"
  result: res

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: assign_id_code
  next: return_unauthorized

assign_id_code:
  assign:
    idCode: ${res.response.body.idCode}

locate_service:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/services/locate_service"
    body:
      service_id: ${incoming.body.service_id}
      user_id_code: ${idCode}
      page_size: ${incoming.body.page_size ?? 10}
      sorting: ${incoming.body.sorting ?? ''}
      search: ${incoming.body.search ?? ''}
      state: ${incoming.body.state ?? ''}
      dependencies: ${incoming.body.dependencies ?? 'all'}
  result: locate_res

return_ok:
  status: 200
  return: ${locate_res.response.body[0]}
  next: end

return_incorrect_request:
  status: 400
  return: "Required parameter(s) missing"
  next: end

return_unauthorized:
  status: 401
  return: "unauthorized"
  next: end
