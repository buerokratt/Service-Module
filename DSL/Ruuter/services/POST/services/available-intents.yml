declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'AVAILABLE-INTENTS'"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: page
        type: number
        description: "Body field 'page'"
      - field: page_size
        type: number
        description: "Body field 'page_size'"
      - field: sorting
        type: string
        description: "Body field 'sorting'"

get_available_intents:
  call: http.get
  args:
    url: "[#SERVICE_TRAINING_RESQL]/byk/list_available_intents"
    query:
      page: ${incoming.body.page}
      page_size: ${incoming.body.page_size}
      sorting: ${incoming.body.sorting}
      search: ${incoming.body.search}
  result: res

return_result:
  return: ${res.response.body}
