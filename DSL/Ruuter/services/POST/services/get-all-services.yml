declaration:
  call: declare
  version: 0.1
  description: "Get all services with name and structure only"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: page
        type: number
        description: "Body field 'page'"
      - field: page_size
        type: number
        description: "Body field 'page_size'"
      - field: sorting
        type: string
        description: "Body field 'sorting'"
      - field: search
        type: string
        description: "Body field 'search'"

get_all_services:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/get-all-services"
    body:
      page: ${incoming.body.page}
      page_size: ${incoming.body.page_size}
      sorting: ${incoming.body.sorting}
      search: ${incoming.body.search}
  limit: 400
  result: services_res

return_result:
  return: ${services_res.response.body}
  next: end

