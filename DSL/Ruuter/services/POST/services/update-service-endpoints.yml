declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'UPDATE-SERVICE-ENDPOINTS'"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: name
        type: string
        description: "Endpoint name"
      - field: fileName
        type: string
        description: "Endpoint file name"
      - field: type
        type: string
        description: "Endpoint type"
      - field: isCommon
        type: boolean
        description: "Endpoint common status"
      - field: serviceId
        type: string
        description: "Service UUID"
      - field: definitions
        type: json
        description: "Endpoint definitions"
    params:
      - field: id
        type: string
        description: "Endpoint UUID"

extract_request_data:
  assign:
    id: ${incoming.params.id}

check_for_type:
  switch:
    - condition: ${id == null}
      next: return_no_type_error

service_edit:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/update-service-endpoints"
    body:
      id: ${id}
      name: ${incoming.body.name}
      fileName: ${incoming.body.fileName}
      type: ${incoming.body.type}
      isCommon: ${incoming.body.isCommon}
      serviceId: ${incoming.body.serviceId}
      definitions: ${incoming.body.definitions}
  result: editedService

return_ok:
  status: 200
  return: "Saved"
  next: end

return_no_type_error:
  status: 400
  return: "Please Specify Endpoint Type 'Prod' Or 'Test'"
  next: end
