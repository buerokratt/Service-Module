declaration:
  call: declare
  version: 0.1
  description: "Returns all endpoints with pagination, sorting and search support"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: pagination
        type: boolean
        description: "Body field 'pagination'"
      - field: page
        type: number
        description: "Body field 'page'"
      - field: page_size
        type: number
        description: "Body field 'page_size'"
      - field: sorting
        type: string
        description: "Body field 'sorting'"
      - field: search
        type: string
        description: "Body field 'search'"

# Fail indexing attempts that exceeded the timeout before reading, so the list (and GUI polling)
# never shows an attempt as Processing indefinitely.
timeout_llm_index_attempts:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/endpoints/timeout_endpoint_llm_index_attempts"
    body: {}
  result: timeout_res

check_timed_out:
  switch:
    - condition: ${timeout_res.response.body != null && timeout_res.response.body.length > 0}
      next: log_timed_out
  next: get_paginated_endpoints

log_timed_out:
  log: "LLM indexing failed (Indexing timed out after 15 minutes) for endpoints: ${JSON.stringify(timeout_res.response.body)}"
  next: get_paginated_endpoints

get_paginated_endpoints:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/endpoints/get_paginated_endpoints"
    body:
      pagination: ${incoming.body.pagination}
      page: ${incoming.body.page}
      page_size: ${incoming.body.page_size}
      sorting: ${incoming.body.sorting}
      search: ${incoming.body.search}
  result: res

return_result:
  return: ${res.response.body}
