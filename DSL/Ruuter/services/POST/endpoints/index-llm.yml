declaration:
  call: declare
  version: 0.1
  description: "Starts an LLM api-tools indexing attempt for an endpoint. Used by create/update flows and manual re-index. Returns 202 when the job is queued; the final result arrives later via llm/index-callback."
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: endpointId
        type: string
        description: "Endpoint UUID to index"
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

assign_id:
  assign:
    endpointId: ${incoming.body.endpointId}

check_required:
  switch:
    - condition: ${endpointId == null || endpointId === ''}
      next: return_bad_request

fetch_endpoint:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/endpoints/get_endpoint_by_id"
    body:
      endpointId: ${endpointId}
  result: endpoint_result

check_endpoint_found:
  switch:
    - condition: ${endpoint_result.response.body == null || endpoint_result.response.body.length === 0}
      next: return_not_found

assign_endpoint:
  assign:
    endpoint: ${endpoint_result.response.body[0]}

# Validation runs before the attempt starts, so an invalid request keeps the existing indexing status.
validate_metadata:
  switch:
    - condition: ${endpoint.name == null || String(endpoint.name).trim() === ''}
      next: assign_name_missing
    - condition: ${endpoint.description == null || String(endpoint.description).trim() === ''}
      next: assign_description_missing
    - condition: ${endpoint.selectedUrl == null || String(endpoint.selectedUrl).trim() === ''}
      next: assign_url_missing
    - condition: ${endpoint.selectedMethod == null || String(endpoint.selectedMethod).trim() === ''}
      next: assign_method_missing
  next: start_attempt

assign_name_missing:
  assign:
    validation_error:
      code: "VALIDATION_NAME_MISSING"
      message: "Indexing needs an endpoint name"
  next: log_validation_failure

assign_description_missing:
  assign:
    validation_error:
      code: "VALIDATION_DESCRIPTION_MISSING"
      message: "Indexing needs an endpoint description"
  next: log_validation_failure

assign_url_missing:
  assign:
    validation_error:
      code: "VALIDATION_URL_MISSING"
      message: "Indexing needs a selected endpoint URL"
  next: log_validation_failure

assign_method_missing:
  assign:
    validation_error:
      code: "VALIDATION_METHOD_MISSING"
      message: "Indexing needs a selected HTTP method"
  next: log_validation_failure

log_validation_failure:
  log: "LLM indexing not started for endpoint ${endpointId}: ${validation_error.code}"
  next: return_validation_error

start_attempt:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/endpoints/start_endpoint_llm_index_attempt"
    body:
      endpointId: ${endpointId}
  result: start_res

check_attempt_started:
  switch:
    - condition: ${start_res.response.body == null || start_res.response.body.length === 0}
      next: return_not_found

assign_attempt:
  assign:
    attemptNo: ${start_res.response.body[0].llmIndexAttemptNo}
    llm_params: ${JSON.parse(endpoint.selectedParams ?? '[]')}

call_llm_index:
  call: http.post
  args:
    url: "[#LLM_RUUTER_PRIVATE]/api-tools/index"
    body:
      endpointId: ${endpoint.endpointId ?? endpointId}
      name: ${endpoint.name}
      description: ${endpoint.description}
      url: ${endpoint.selectedUrl}
      method: ${endpoint.selectedMethod}
      params: ${llm_params}
      attemptNo: ${attemptNo}
  result: llm_result

check_llm_result:
  switch:
    - condition: ${llm_result != null && llm_result.response != null && 200 <= llm_result.response.statusCodeValue && llm_result.response.statusCodeValue < 300 && llm_result.response.body.response.success === true}
      next: log_submitted
  next: assign_submission_failure

log_submitted:
  log: "LLM indexing submitted for endpoint ${endpointId}, attempt ${attemptNo}"
  next: assign_accepted_response

assign_accepted_response:
  assign:
    accepted_response:
      message: "Indexing started"
      attemptNo: ${attemptNo}
  next: return_accepted

assign_submission_failure:
  assign:
    failureReason: "${'Submission to LLM module failed (HTTP ' + (llm_result != null && llm_result.response != null ? llm_result.response.statusCodeValue : 'unknown') + ')'}"

mark_submission_failed:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/endpoints/complete_endpoint_llm_index_attempt"
    body:
      endpointId: ${endpointId}
      attemptNo: ${attemptNo}
      status: "FAILED"
      failureReason: ${failureReason}
  result: mark_failed_res

log_submission_failure:
  log: "LLM indexing failed for endpoint ${endpointId}, attempt ${attemptNo}: ${failureReason}"
  next: assign_failed_response

assign_failed_response:
  assign:
    failed_response:
      code: "SUBMISSION_FAILED"
      message: ${failureReason}
  next: return_failed

return_accepted:
  status: 202
  return: ${accepted_response}
  next: end

# HTTP 200 on purpose: Ruuter drops the response body of non-2xx replies between flows,
# so callers could not read the validation code. Callers detect it by the VALIDATION_ code.
return_validation_error:
  status: 200
  return: ${validation_error}
  next: end

return_failed:
  status: 500
  return: ${failed_response}
  next: end

return_not_found:
  status: 404
  return: "Endpoint not found, LLM indexing skipped"
  next: end

return_bad_request:
  status: 400
  return: "endpointId is required"
  next: end
