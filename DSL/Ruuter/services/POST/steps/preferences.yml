declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'PREFERENCES'"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: step
        type: string
        description: "Body field 'step'"
      - field: ordinality
        type: number
        description: "Body field 'ordinality'"
      - field: pinned
        type: boolean
        description: "Body field 'pinned'"
      - field: active
        type: boolean
        description: "Body field 'active'"  

extractRequestData:
  assign:
    step: ${incoming.body.step}
    ordinality: ${incoming.body.ordinality}
    pinned: ${incoming.body.pinned}
    active: ${incoming.body.active}    

get_user_info:
  call: http.post
  args:
    url: "[#SERVICE_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${incoming.headers.cookie}
    plaintext: "customJwtCookie"
  result: res

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: assignIdCode
  next: return_unauthorized

assignIdCode:
  assign:
    idCode: ${res.response.body.idCode}

update_user_step_preferences:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/update-user-step-preferences"
    body:
      step: ${step}
      ordinality: ${ordinality}
      pinned: ${pinned}
      active: ${active}
      user_id_code: ${idCode}
  result: update_preferences_res

get_user_step_preferences:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/get-user-step-preferences"
    body:
      user_id_code: ${idCode}
  result: preferences

return_preferences:
  return: ${preferences.response.body}
  next: end

return_unauthorized:
  status: 401
  return: "unauthorized"
  next: end
