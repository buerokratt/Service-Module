declaration:
  call: declare
  version: 0.1
  description: "Get services by endpoint id"
  method: get
  accepts: json
  returns: json
  namespace: service
  allowlist:
    params:
      - field: endpointId
        type: string
        description: "Endpoint UUID"
      - field: excludedServiceId
        type: string
        description: "Optional UUID of the service to exclude"

check_for_parameters:
  switch:
    - condition: ${incoming.params == null || incoming.params.endpointId == null}
      next: return_incorrect_request

get_service_ids_by_endpoint_id:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/endpoints/get_service_ids_by_endpoint_id"
    body:
      endpointId: ${incoming.params.endpointId}
  result: service_id_result

assign_service_ids:
  assign:
    service_ids: ${service_id_result.response.body[0].serviceIds}

get_services_by_ids:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/services/get_services_by_ids"
    body:
      serviceIds: ${service_ids.filter((id) => id !== incoming.params.excludedServiceId)}
  result: results

return_ok:
  status: 200
  wrapper: false
  return: ${results.response.body}
  next: end

return_incorrect_request:
  status: 400
  return: "Required parameter(s) missing"
  next: end
