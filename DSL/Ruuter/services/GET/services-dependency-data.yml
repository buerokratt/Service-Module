declaration:
  call: declare
  version: 0.1
  description: "Returns all services with structure for dependency graph computation"
  method: get
  accepts: json
  returns: json
  namespace: service

get_services_dependency_data:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/get-services-dependency-data"
  result: results

return_ok:
  status: 200
  wrapper: false
  return: ${results.response.body}
  next: end
