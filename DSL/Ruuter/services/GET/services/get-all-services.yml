declaration:
  call: declare
  version: 0.1
  description: "Get all services with name and structure only"
  method: post
  accepts: json
  returns: json
  namespace: service

get_all_services:
  call: http.post
  args:
    url: "[#SERVICE_RESQL]/get-all-services"
  result: services_res

return_result:
  return: ${services_res.response.body}
  next: end

